name: "deploy"
description: "This action deploys the pax and tar in artifactory"

inputs:
  source_repo:
    description: 'The source repository that triggered this build (passed from external workflow)'
    required: false
  source_pr:
    description: 'The source PR number that triggered this build (passed from external workflow)'
    required: false


runs:
  using: "composite"
  steps:
    - name: 'deploy'
      run: |
        # source_repo/source_pr come from external workflows, restrict them to safe characters
        if [[ -n "$SOURCE_PR" && ! "$SOURCE_PR" =~ ^[0-9]+$ ]]; then
          echo "Invalid source_pr: must be a pull request number"
          exit 1
        fi
        if [[ -n "$SOURCE_REPO" && ! "$SOURCE_REPO" =~ ^[A-Za-z0-9._-]+$ ]]; then
          echo "Invalid source_repo: only letters, digits, '.', '_' and '-' are allowed"
          exit 1
        fi
        if [[ -n "$PR_NUMBER" && ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
          echo "Invalid pull request number"
          exit 1
        fi
        TIMESTAMP=$(date +%Y%m%d.%H%M%S)
        mv zlux.pax ${REPOSITORY_NAME}-${ZOWE_VERSION}-${TIMESTAMP}.pax
        mv zlux.tar ${REPOSITORY_NAME}-${ZOWE_VERSION}-${TIMESTAMP}.tar

        # Release candidate. zowe-install-packaging consumes this exact path,
        # so it must stay '<version>-RC'.
        if [ "${IS_RC}" = "true" ]; then
          DEPLOY_DIR="zlux-core/${ZOWE_VERSION}-RC"

        # Custom build with one or more extra PRs merged in
        elif [ -n "${CUSTOM_PR}" ]; then
          DEPLOY_DIR="zlux-core/${ZOWE_VERSION}-CUSTOM-${REPOSITORY_NAME}-${JFROG_CLI_BUILD_NUMBER}"

        # Build triggered by an external workflow passing source repo/PR info
        elif [ -n "$SOURCE_PR" ]; then
          DEPLOY_DIR="zlux-core/${ZOWE_VERSION}-$SOURCE_REPO-PR-$SOURCE_PR"

        # PR opened directly on the calling repo (e.g. zlux-app-server PR #45)
        elif [ -n "$PR_NUMBER" ]; then
          DEPLOY_DIR="zlux-core/${ZOWE_VERSION}-${REPOSITORY_NAME}-PR-$PR_NUMBER"

        # Branch build (e.g. push to v3.x/staging)
        else
          DEPLOY_DIR="zlux-core/${ZOWE_VERSION}-${DEPLOY_BRANCH^^}"
        fi

        PAX_PATH="${ARTIFACTORY_REPO}/${DEPLOY_DIR}/zlux-core-${ZOWE_VERSION}-${TIMESTAMP}.pax"
        TAR_PATH="${ARTIFACTORY_REPO}/${DEPLOY_DIR}/zlux-core-${ZOWE_VERSION}-${TIMESTAMP}.tar"

        echo "=========================================="
        echo "Deploy destination:"
        echo "  PAX: ${PAX_PATH}"
        echo "  TAR: ${TAR_PATH}"
        echo "=========================================="
        jfrog rt u "${REPOSITORY_NAME}-${ZOWE_VERSION}-${TIMESTAMP}.pax" "${PAX_PATH}"
        jfrog rt u "${REPOSITORY_NAME}-${ZOWE_VERSION}-${TIMESTAMP}.tar" "${TAR_PATH}"
      env:
        SOURCE_REPO: ${{ inputs.source_repo }}
        SOURCE_PR: ${{ inputs.source_pr }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      shell: bash

    - name: 'report build status'
      run: |
        curl -s -X POST \
          -H "Authorization: token $GH_TOKEN" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/repos/$GH_REPOSITORY/statuses/$COMMIT_SHA" \
          -d '{
            "state": "success",
            "context": "build",
            "description": "ZLUX Core build succeeded",
            "target_url": "'"$GH_SERVER_URL/$GH_REPOSITORY/actions/runs/$GH_RUN_ID"'"
          }'
        echo "Reported 'build' commit status as success"
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPOSITORY: ${{ github.repository }}
        COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        GH_SERVER_URL: ${{ github.server_url }}
        GH_RUN_ID: ${{ github.run_id }}
      shell: bash
