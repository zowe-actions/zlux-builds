name: "deploy"
description: "This action deploys the pax and tar in artifactory"

inputs:
  source_repo:
    description: 'The source repository that triggered this build (passed from external workflow)'
    required: false
  source_pr:
    description: 'The source PR number that triggered this build (passed from external workflow)'
    required: false


runs:
  using: "composite"
  steps:
    - name: 'deploy'
      run: |
        TIMESTAMP=$(date +%Y%m%d.%H%M%S)
        mv zlux.pax ${REPOSITORY_NAME}-${ZOWE_VERSION}-${TIMESTAMP}.pax
        mv zlux.tar ${REPOSITORY_NAME}-${ZOWE_VERSION}-${TIMESTAMP}.tar

        # Scenario 1: Custom build with multiple PRs merged (inputs provided to build action)
        # Path clearly shows it's a CUSTOM multi-PR build, which repo triggered it, and the build number
        if [ -n "${CUSTOM_PR}" ]; then
          DEPLOY_DIR="zlux-core/${ZOWE_VERSION}-CUSTOM-${REPOSITORY_NAME}-${JFROG_CLI_BUILD_NUMBER}"
          PAX_PATH="${ARTIFACTORY_REPO}/${DEPLOY_DIR}/zlux-core-${ZOWE_VERSION}-${TIMESTAMP}.pax"
          TAR_PATH="${ARTIFACTORY_REPO}/${DEPLOY_DIR}/zlux-core-${ZOWE_VERSION}-${TIMESTAMP}.tar"

        # Scenario 2: Build triggered by an external workflow passing source repo/PR info
        elif [ -n "${{ inputs.source_pr }}" ]; then
          SOURCE_REPO="${{ inputs.source_repo }}"
          SOURCE_PR="${{ inputs.source_pr }}"
          DEPLOY_DIR="zlux-core/${ZOWE_VERSION}-${SOURCE_REPO}-PR-${SOURCE_PR}"
          PAX_PATH="${ARTIFACTORY_REPO}/${DEPLOY_DIR}/zlux-core-${ZOWE_VERSION}-${TIMESTAMP}.pax"
          TAR_PATH="${ARTIFACTORY_REPO}/${DEPLOY_DIR}/zlux-core-${ZOWE_VERSION}-${TIMESTAMP}.tar"

        # Scenario 3: PR opened directly on the calling repo (e.g. zlux-app-server PR #45)
        elif [ -n "${{ github.event.pull_request.number }}" ]; then
          CURRENT_PR="${{ github.event.pull_request.number }}"
          DEPLOY_DIR="zlux-core/${ZOWE_VERSION}-${REPOSITORY_NAME}-PR-${CURRENT_PR}"
          PAX_PATH="${ARTIFACTORY_REPO}/${DEPLOY_DIR}/zlux-core-${ZOWE_VERSION}-${TIMESTAMP}.pax"
          TAR_PATH="${ARTIFACTORY_REPO}/${DEPLOY_DIR}/zlux-core-${ZOWE_VERSION}-${TIMESTAMP}.tar"

        # Scenario 4: Staging/branch build (push to v3.x/staging, no PR)
        else
          DEPLOY_DIR="zlux-core/${ZOWE_VERSION}-${DEPLOY_BRANCH^^}"
          PAX_PATH="${ARTIFACTORY_REPO}/${DEPLOY_DIR}/zlux-core-${ZOWE_VERSION}-${TIMESTAMP}.pax"
          TAR_PATH="${ARTIFACTORY_REPO}/${DEPLOY_DIR}/zlux-core-${ZOWE_VERSION}-${TIMESTAMP}.tar"
        fi

        echo "=========================================="
        echo "Deploy destination:"
        echo "  PAX: ${PAX_PATH}"
        echo "  TAR: ${TAR_PATH}"
        echo "=========================================="
        jfrog rt u "${REPOSITORY_NAME}-${ZOWE_VERSION}-${TIMESTAMP}.pax" "${PAX_PATH}"
        jfrog rt u "${REPOSITORY_NAME}-${ZOWE_VERSION}-${TIMESTAMP}.tar" "${TAR_PATH}"
      shell: bash

    - name: 'report build status'
      run: |
        curl -s -X POST \
          -H "Authorization: token ${{ github.token }}" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha || github.sha }}" \
          -d '{
            "state": "success",
            "context": "build",
            "description": "ZLUX Core build succeeded",
            "target_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }'
        echo "Reported 'build' commit status as success"
      shell: bash
