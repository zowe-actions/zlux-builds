name: "prepare workflow"
description: "This action helps build zlux-core"
inputs:
  github-user:
    description: 'github user'
    required: false
  github-password:
    description: 'github password'
    required: false
  github-email:
    description: 'github email'
    required: false
  default-base:
    description: 'base branch to build from'
    required: false
  zowe-major-version:
    description: 'Zowe major version override (2, 3, etc.). Auto-detected from branch if not set.'
    required: false
  rc:
    description: 'Set to true to build a release candidate from the vX.x/rc branches'
    required: false
    default: 'false'
  release-version:
    description: 'Full release version (X.Y.Z). Overrides the version read from the Zowe manifest.'
    required: false

runs:
  using: "composite"
  steps:
    - name: 'process env vars'
      run: |
        # Sanitize envvars by (in order)
        # 1. remove comments (start with #); 
        # 2. remove blank lines
        sed '/^#/d' envvars.env | awk NF > envvars.env.new
        rm envvars.env
        mv envvars.env.new envvars.env
        cat envvars.env >> $GITHUB_ENV
      working-directory: ${{ github.action_path }}
      shell: bash
    
    - name: 'determine current branch or PR'
      run: |
        if [ -n "${{ inputs.default-base }}" ]
        then 
          echo CURRENT_BRANCH=${{ inputs.default-base }} >> $GITHUB_ENV
        elif [ -z "${{ github.event.pull_request.number }}" ]
        then
          echo CURRENT_BRANCH=${GITHUB_REF#refs/heads/} >> $GITHUB_ENV
        else
          echo CURRENT_BRANCH=${{ github.event.pull_request.base.ref }} >> $GITHUB_ENV
          echo CURRENT_PR=PR-${{ github.event.pull_request.number }} >> $GITHUB_ENV
        fi
        echo REPOSITORY_NAME=$GITHUB_REPOSITORY | sed 's/zowe\///' >> $GITHUB_ENV
      shell: bash

    - name: 'resolve build target'
      run: |
        # Major version selects which config/vN.env to load
        if [ -n "${{ inputs.zowe-major-version }}" ]; then
          ZOWE_MAJOR_VERSION="${{ inputs.zowe-major-version }}"
        else
          # Auto-detect from CURRENT_BRANCH (e.g., v3.x/staging -> 3, v2.x/rc -> 2)
          ZOWE_MAJOR_VERSION=$(echo "$CURRENT_BRANCH" | sed -n 's/^v\([0-9]*\)\..*/\1/p')
          if [ -z "$ZOWE_MAJOR_VERSION" ]; then
            echo "WARNING: Could not detect Zowe version from branch '$CURRENT_BRANCH', defaulting to 3"
            ZOWE_MAJOR_VERSION=3
          fi
        fi

        CONFIG_FILE="${{ github.action_path }}/../../config/v${ZOWE_MAJOR_VERSION}.env"
        if [ ! -f "$CONFIG_FILE" ]; then
          echo "ERROR: No config file found at $CONFIG_FILE"
          ls "${{ github.action_path }}/../../config"/*.env 2>/dev/null || echo "  (none)"
          exit 1
        fi
        sed '/^#/d' "$CONFIG_FILE" | awk NF >> $GITHUB_ENV
        # $GITHUB_ENV only reaches later steps, so read the one value this step
        # needs straight out of the file. Values are literal, not shell-quoted.
        ZOWE_MANIFEST_BRANCH=$(sed -n 's/^ZOWE_MANIFEST_BRANCH=//p' "$CONFIG_FILE" | tail -1)

        # A release candidate builds the vX.x/rc branches. Written after the
        # config so these take precedence.
        if [ "${{ inputs.rc }}" = "true" ]; then
          ZOWE_MANIFEST_BRANCH="v${ZOWE_MAJOR_VERSION}.x/rc"
          {
            echo "IS_RC=true"
            echo "CURRENT_BRANCH=v${ZOWE_MAJOR_VERSION}.x/rc"
            echo "ZOWE_MANIFEST_BRANCH=${ZOWE_MANIFEST_BRANCH}"
            echo "DEFAULT_PLUGIN_BRANCH=v${ZOWE_MAJOR_VERSION}.x/rc"
          } >> $GITHUB_ENV
        fi

        if [ -n "${{ inputs.release-version }}" ]; then
          ZOWE_VERSION="${{ inputs.release-version }}"
        else
          ZOWE_VERSION=$(curl -fsSL "https://raw.githubusercontent.com/zowe/zowe-install-packaging/${ZOWE_MANIFEST_BRANCH}/manifest.json.template" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).version))")
        fi
        if [ -z "$ZOWE_VERSION" ]; then
          echo "ERROR: Could not determine the Zowe version"
          exit 1
        fi
        echo "ZOWE_VERSION=${ZOWE_VERSION}" >> $GITHUB_ENV
        echo "ZOWE_MAJOR_VERSION=${ZOWE_MAJOR_VERSION}" >> $GITHUB_ENV

        echo "Building Zowe ${ZOWE_VERSION} (v${ZOWE_MAJOR_VERSION}) from ${CURRENT_BRANCH}"
      shell: bash
    
    - name: 'export github username and email'
      run: |
        if [ -n "${{ inputs.github-user }}" ]
        then
          git config --global user.name ${{ inputs.github-user }}
          echo GITHUB_USER=${{ inputs.github-user }} >> $GITHUB_ENV
        fi
        if [ -n "${{ inputs.github-email }}" ]
        then
          git config --global user.email ${{ inputs.github-email }}
        fi
        if [ -n "${{ inputs.github-password }}" ]
        then
          echo GITHUB_PASSWORD=${{ inputs.github-password }} >> $GITHUB_ENV
        fi
        echo GITHUB_REPOSITORY=${{ github.repository }} >> $GITHUB_ENV
        echo DEPLOY_BRANCH=$CURRENT_BRANCH | sed -e 's+\/+\-+' >> $GITHUB_ENV
      shell: bash
